services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-mindmap-app
    networks:
      - smart_mindmap_net
    ports:
      - "100.112.187.176:8081:8080"
    environment:
      TZ: Asia/Jakarta
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  smart_mindmap_net:
    name: smart-mindmap-network
    ipam:
      config:
        - subnet: 172.24.0.0/16
          gateway: 172.24.0.1
